[project]
name = "trackpermanence"
version = "0.1.0"
description = "PyTorch reproduction of 'Offline Tracking with Object Permanence' (Liu & Caesar, arXiv:2310.01288) trained on ArgoVerse 2 pseudo-occlusions"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackpermanence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
