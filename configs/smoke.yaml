# Small configuration for a local smoke run (Apple Silicon / CPU) on the
# 12-log AV2 subset preprocessed by LabelFormer.py.
run_name: smoke

data:
  root: ../LabelFormer.py/data/processed

occlusion:
  max_hist_s: 2.5
  min_gap_s: 1.5
  max_gap_s: 12.5
  max_future_s: 2.5
  num_negatives: 8
  pos_noise: 0.1
  yaw_noise: 0.05
  vel_noise: 0.3
  rotate: true
  min_path_m: 2.0   # sample histories only from moving tracks

model:
  d_model: 64
  nhead: 4

train:
  epochs: 60
  batch_size: 16
  lr: 5.0e-4
  weight_decay: 1.0e-4
  grad_clip: 5.0
  device: auto
  seed: 0
  num_workers: 0
